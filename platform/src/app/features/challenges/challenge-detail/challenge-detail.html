@if (challenge(); as item) {
  <a mat-button routerLink="/challenges" class="challenge-detail__back">← Challenges</a>

  <mat-card appearance="outlined" class="challenge-detail__card">
    @if (!loaded()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <mat-card-content>
      <markdown [src]="item.contentPath" (ready)="loaded.set(true)" (error)="loaded.set(true)" />
    </mat-card-content>
  </mat-card>
} @else {
  <p>Challenge não encontrado.</p>
}
