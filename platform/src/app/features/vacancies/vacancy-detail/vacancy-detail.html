@if (vacancy(); as item) {
  <a mat-button routerLink="/vacancies" class="vacancy-detail__back">← Vagas</a>

  <mat-card appearance="outlined" class="vacancy-detail__card">
    <mat-tab-group>
      <mat-tab label="Visão geral">
        @if (!overviewLoaded()) {
          <mat-progress-bar mode="indeterminate" />
        }
        <markdown
          [src]="item.contentPath"
          class="vacancy-detail__markdown"
          (ready)="overviewLoaded.set(true)"
          (error)="overviewLoaded.set(true)"
        />
      </mat-tab>
      <mat-tab label="Requisitos">
        @if (!requirementsLoaded()) {
          <mat-progress-bar mode="indeterminate" />
        }
        <markdown
          [src]="item.requirementsPath"
          class="vacancy-detail__markdown"
          (ready)="requirementsLoaded.set(true)"
          (error)="requirementsLoaded.set(true)"
        />
      </mat-tab>
      <mat-tab label="Preparação">
        @if (!prepLoaded()) {
          <mat-progress-bar mode="indeterminate" />
        }
        <markdown
          [src]="item.interviewPrepPath"
          class="vacancy-detail__markdown"
          (ready)="prepLoaded.set(true)"
          (error)="prepLoaded.set(true)"
        />
      </mat-tab>
    </mat-tab-group>
  </mat-card>
} @else {
  <p>Vaga não encontrada.</p>
}
