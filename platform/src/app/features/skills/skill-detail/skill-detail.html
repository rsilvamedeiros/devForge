@if (skill(); as item) {
  <a mat-button routerLink="/skills" class="skill-detail__back">← Skills</a>

  <mat-card appearance="outlined" class="skill-detail__card">
    @if (!loaded()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <mat-card-content>
      <markdown [src]="item.contentPath" (ready)="loaded.set(true)" (error)="loaded.set(true)" />
    </mat-card-content>
  </mat-card>
} @else {
  <p>Skill não encontrada.</p>
}
