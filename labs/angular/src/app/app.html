<app-header (menuToggle)="toggleMenu()" />

<mat-sidenav-container class="app-shell">
  <mat-sidenav [mode]="isHandset() ? 'over' : 'side'" [opened]="sidenavOpened()" class="app-sidenav">
    <app-sidebar (linkClick)="closeOnNavigate()" />
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
