<mat-toolbar class="header">
  <button mat-icon-button type="button" (click)="menuToggle.emit()" aria-label="Abrir ou fechar navegação"><mat-icon>menu</mat-icon></button>
  <div class="header__brand"><span class="header__logo"><mat-icon>candlestick_chart</mat-icon></span><span><strong class="header__title">Atlas Trade</strong><small>Digital Equities</small></span></div>
  <div class="header__market"><i></i><span><strong>Mercado aberto</strong><small>B3 · Tempo real simulado</small></span></div>
  <div class="header__spacer"></div>
  <form class="header__search" role="search" (submit)="search($event)"><mat-icon>search</mat-icon><input type="search" aria-label="Buscar ativo por ticker" placeholder="Buscar ticker" [value]="searchTerm()" (input)="searchTerm.set($any($event.target).value)" /><span>Enter</span></form>
  <button
    mat-icon-button
    type="button"
    class="header__theme"
    (click)="theme.toggle()"
    [class.is-active]="theme.isDark()"
    [attr.aria-label]="theme.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
    [attr.title]="theme.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
  >
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
  <button mat-icon-button type="button" aria-label="Notificações" class="header__notification"><mat-icon>notifications_none</mat-icon><i></i></button>
  <div class="header__profile"><span>DE</span><div><strong>Conta demo</strong><small>Trader lab</small></div><mat-icon>expand_more</mat-icon></div>
</mat-toolbar>
